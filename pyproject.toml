[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrum-sdk"
version = "0.1.0"
description = "Официальный клиент Astrum API для Python (Пейин/Пейаут)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "cryptography>=41",
]

[tool.setuptools.packages.find]
include = ["astrum_sdk*"]
